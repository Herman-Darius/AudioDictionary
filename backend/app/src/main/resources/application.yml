spring:
  datasource:
    url: jdbc:mysql://localhost/audiobook
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
excel:
  upload:
    allowed-content-types:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-excel
clam:
  scan-command: /usr/bin/clamscan
logging:
    level:
      com.dictionary.app.services.ExcelService: DEBUG